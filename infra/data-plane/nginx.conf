events {}
http {
  upstream policy_dp {
    least_conn;
    server policy-data-plane-1:8091 max_fails=3 fail_timeout=5s;
    server policy-data-plane-2:8091 max_fails=3 fail_timeout=5s;
  }
  server {
    listen 8091;
    location / {
      proxy_pass http://policy_dp;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Request-Id $request_id;
      proxy_connect_timeout 1s;
      proxy_read_timeout 5s;
    }
  }
}
