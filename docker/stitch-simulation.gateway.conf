server {
    listen 80;
    client_max_body_size 4m;
    # The isolated runner has only guarded read paths; no /clients, sync or raw source API.
    location ~ ^/v1/integrations/(retrieval|stitch)/(mcp|download|retrieve|search|children|context|calls)$ {
        proxy_pass http://authorization-api:8080;
        proxy_read_timeout 25s;
        proxy_set_header Host $host;
    }
    # Local trusted controller -> simulator runner. Runner separately checks its internal token.
    location /runner/ {
        proxy_pass http://stitchy-simulator:8767/;
        proxy_read_timeout 25s;
    }
    location / { return 404; }
}
