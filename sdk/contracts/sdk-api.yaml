openapi: 3.0.3
info:
  title: ZT Security Integrated Authorization and SDK API
  version: 4.75.0
  description: |
    One server: apps/authorization-api. Existing dashboard requests and SDK requests share policy and approval enforcement.
    Resources in SDK requests use type/id and subjects must be registered identities.
    No external executor, attestation verifier, capability verifier or Kubernetes apply connector is installed by default.
servers:
  - url: http://localhost:8080
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
  parameters:
    Tenant:
      name: X-Tenant-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
    Workspace:
      name: X-Workspace-Id
      in: header
      required: false
      schema: {type: string, format: uuid}
  responses:
    Object:
      description: Operation result; inspect status/verified/applied rather than assuming success.
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
    Error:
      description: Authentication, authorization, validation, conflict or missing scoped resource.
      content:
        application/json:
          schema: {type: object, additionalProperties: true}
  schemas:
    Principal:
      type: object
      required: [id, type]
      properties:
        id: {type: string}
        type: {type: string}
        attributes: {type: object, additionalProperties: true}
    Action:
      type: object
      required: [name]
      properties:
        name: {type: string}
    Resource:
      type: object
      required: [type, id]
      properties:
        type: {type: string}
        id: {type: string}
        attributes: {type: object, additionalProperties: true}
    StructuredRequest:
      type: object
      required: [principal, action, resource]
      properties:
        principal: {$ref: '#/components/schemas/Principal'}
        action: {$ref: '#/components/schemas/Action'}
        resource: {$ref: '#/components/schemas/Resource'}
        context: {type: object, additionalProperties: true}
    SdkRequest:
      type: object
      required: [subject, action, resource]
      properties:
        subject: {type: string, description: Registered identity externalId}
        action: {type: string}
        resource: {type: string, pattern: '^[^/]+/.+$', example: bank_account/ACC-1001}
        tenantId: {type: string, format: uuid, description: Must match X-Tenant-Id}
        attributes:
          type: object
          additionalProperties: true
          description: AI_AGENT requests require task_id and tool_id; amount and other runtime context are supplied here.
    EvaluateRequest:
      oneOf:
        - {$ref: '#/components/schemas/StructuredRequest'}
        - {$ref: '#/components/schemas/SdkRequest'}
    Decision:
      type: object
      required: [requestId, decision, reason]
      properties:
        id: {type: string, format: uuid, description: Durable SDK decision identifier}
        requestId: {type: string, format: uuid}
        traceId: {type: string}
        decision: {type: string, enum: [ALLOW, STEP_UP, DENY]}
        reason: {type: string}
        risk:
          type: object
          properties:
            score: {type: number}
            level: {type: string}
        matchedPolicies: {type: array, items: {type: object, additionalProperties: true}}
        audit: {type: object, additionalProperties: true}
    ExecutionContract:
      type: object
      required: [action, resource, policyDecision]
      properties:
        action: {type: string}
        resource: {type: string, description: Exact type/id from stored decision}
        policyDecision:
          type: object
          required: [id]
          properties:
            id: {type: string, format: uuid}
        evidenceIds: {type: array, items: {type: string, format: uuid}}
        approval:
          type: object
          nullable: true
          properties:
            id: {type: string, format: uuid}
