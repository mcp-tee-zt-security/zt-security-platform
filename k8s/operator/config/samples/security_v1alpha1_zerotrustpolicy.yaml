apiVersion: security.zt-platform.io/v1alpha1
kind: ZeroTrustPolicy
metadata:
  name: production-api
spec:
  policyText: |
    policy "restricted_data_export" {
      priority 5
      effect deny
      description "Block external export of restricted data"
      principal.type == "AI_AGENT"
      action == "data.export"
      condition {
        resource.classification in ["CONFIDENTIAL", "RESTRICTED"]
        and destination.type == "external"
      }
    }
