apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: zerotrustpolicies.security.zt-platform.io
spec:
  group: security.zt-platform.io
  scope: Namespaced
  names:
    plural: zerotrustpolicies
    singular: zerotrustpolicy
    kind: ZeroTrustPolicy
    shortNames: [ztp]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      additionalPrinterColumns:
        - {name: Phase, type: string, jsonPath: .status.phase}
        - {name: Reason, type: string, jsonPath: .status.reason}
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [policyText]
              properties:
                policyText: {type: string, minLength: 1, maxLength: 65536}
                workload: {type: string}
                identityRequired: {type: boolean}
                attestationRequired: {type: boolean}
                capabilities: {type: array, items: {type: string}}
                decision: {type: string}
                approvalRequired: {type: boolean}
            status:
              type: object
              properties:
                phase: {type: string}
                observedHash: {type: string}
                observedGeneration: {type: integer, format: int64}
                platformPolicyId: {type: string}
                reason: {type: string}
                message: {type: string}
      subresources: {status: {}}
