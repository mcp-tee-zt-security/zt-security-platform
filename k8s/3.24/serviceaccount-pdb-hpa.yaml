apiVersion: v1
kind: ServiceAccount
metadata:
  name: authorization-api
  namespace: zt-security
automountServiceAccountToken: false
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: {name: authorization-api, namespace: zt-security}
spec:
  minAvailable: 2
  selector: {matchLabels: {app: authorization-api}}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: {name: authorization-api, namespace: zt-security}
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: authorization-api}
  minReplicas: 3
  maxReplicas: 10
  behavior:
    scaleDown: {stabilizationWindowSeconds: 300}
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 65}}
