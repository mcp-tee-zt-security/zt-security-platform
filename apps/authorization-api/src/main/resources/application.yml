spring:
  application:
    name: zt-authorization-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/zt}
    username: ${DB_USERNAME:zt}
    password: ${DB_PASSWORD:zt}
    hikari:
      connection-init-sql: SET search_path TO ${DB_SCHEMA:zt_security_475}
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        default_schema: ${DB_SCHEMA:zt_security_475}
  flyway:
    enabled: true
    schemas: ${DB_SCHEMA:zt_security_475}
    default-schema: ${DB_SCHEMA:zt_security_475}
    create-schemas: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    type: redis
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${ZT_OIDC_ISSUER_URI:http://localhost:8089/realms/zt}
zt:
  stitch:
    enabled: ${ZT_STITCH_INTEGRATION_ENABLED:false}
    audience: ${ZT_STITCH_INTEGRATION_AUDIENCE:zt-stitch-integration}
    allow-development-sync-key: ${ZT_STITCH_ALLOW_DEVELOPMENT_SYNC_KEY:false}
    session-ttl-seconds: ${ZT_STITCH_SESSION_TTL_SECONDS:300}
    allowed-origins: ${ZT_STITCH_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
    max-source-age-seconds: ${ZT_STITCH_MAX_SOURCE_AGE_SECONDS:120}
  poc:
    stitch:
      enabled: ${ZT_STITCH_POC_ENABLED:false}
      audience: ${ZT_STITCH_POC_AUDIENCE:zt-stitch-poc}
  security:
    oidc:
      enabled: ${ZT_OIDC_ENABLED:false}
      issuer-uri: ${ZT_OIDC_ISSUER_URI:http://localhost:8089/realms/zt}
      jwk-set-uri: ${ZT_OIDC_JWK_SET_URI:}
    api-key: ${ZT_API_KEY:dev-master-key}
    audit:
      local-archive: ${ZT_AUDIT_LOCAL_ARCHIVE:./data/audit-archive}
      s3-enabled: ${ZT_AUDIT_S3_ENABLED:false}
      bucket: ${ZT_AUDIT_BUCKET:}
    mcp:
      audience: ${ZT_MCP_AUDIENCE:zt-mcp-gateway}
      timeout-seconds: ${ZT_MCP_TIMEOUT_SECONDS:15}
      max-request-bytes: ${ZT_MCP_MAX_REQUEST_BYTES:65536}
      max-response-bytes: ${ZT_MCP_MAX_RESPONSE_BYTES:2097152}
      approval-ttl-seconds: ${ZT_MCP_APPROVAL_TTL_SECONDS:900}
      max-concurrent-calls: ${ZT_MCP_MAX_CONCURRENT_CALLS:32}
      allow-http: ${ZT_MCP_ALLOW_HTTP:false}
      allow-development-http-registration: ${ZT_MCP_ALLOW_DEVELOPMENT_HTTP_REGISTRATION:true}
      registration-hosts: ${ZT_MCP_REGISTRATION_HOSTS:host.docker.internal,localhost,127.0.0.1}
      credential-env-allowlist: ${ZT_MCP_CREDENTIAL_ENV_ALLOWLIST:}
      allowed-origins: ${ZT_MCP_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
      servers: {}
    scim:
      tokens: ${ZT_SCIM_TOKENS:}
    siem:
      enabled: ${ZT_SIEM_ENABLED:true}
    idempotency:
      ttl-hours: ${ZT_IDEMPOTENCY_TTL_HOURS:24}
    rate-limit:
      requests-per-minute: ${ZT_RATE_LIMIT:120}
      window-seconds: 60
    runtime:
      session-ttl-seconds: ${ZT_RUNTIME_SESSION_TTL_SECONDS:3600}
    risk-scoring:
      max-score: ${ZT_RISK_MAX_SCORE:100.0}
      attack-path-weight: ${ZT_RISK_ATTACK_PATH_WEIGHT:0.30}
      identity-weight: ${ZT_RISK_IDENTITY_WEIGHT:0.20}
      vulnerability-weight: ${ZT_RISK_VULNERABILITY_WEIGHT:0.25}
      threat-weight: ${ZT_RISK_THREAT_WEIGHT:0.25}
      attack-node-weight: ${ZT_RISK_ATTACK_NODE_WEIGHT:0.35}
      blast-attack-weight: ${ZT_BLAST_ATTACK_WEIGHT:0.55}
      blast-impact-weight: ${ZT_BLAST_IMPACT_WEIGHT:0.45}
      blast-path-risk-weight: ${ZT_BLAST_PATH_RISK_WEIGHT:0.60}
      blast-criticality-weight: ${ZT_BLAST_CRITICALITY_WEIGHT:0.40}
      identity-impossible-travel-score: ${ZT_RISK_IDENTITY_IMPOSSIBLE_TRAVEL_SCORE:40.0}
      identity-privilege-change-score: ${ZT_RISK_IDENTITY_PRIVILEGE_CHANGE_SCORE:30.0}
      identity-suspicious-session-score: ${ZT_RISK_IDENTITY_SUSPICIOUS_SESSION_SCORE:30.0}
      predictive-exposure-weight: ${ZT_RISK_PREDICTIVE_EXPOSURE_WEIGHT:0.35}
      predictive-threat-weight: ${ZT_RISK_PREDICTIVE_THREAT_WEIGHT:0.40}
      predictive-identity-weight: ${ZT_RISK_PREDICTIVE_IDENTITY_WEIGHT:0.25}
      runtime-threat-score-threshold: ${ZT_RUNTIME_THREAT_SCORE_THRESHOLD:0.80}
      llm-temperature: ${ZT_PRIVATE_LLM_TEMPERATURE:0.10}
      replay-default-score: ${ZT_REPLAY_DEFAULT_SCORE:0.20}
      policy-confidence-threshold: ${ZT_POLICY_CONFIDENCE_THRESHOLD:0.70}
      copilot-confidence: ${ZT_COPILOT_CONFIDENCE:0.92}
      critical-threshold: ${ZT_RISK_CRITICAL_THRESHOLD:85.0}
      high-threshold: ${ZT_RISK_HIGH_THRESHOLD:65.0}
      elevated-threshold: ${ZT_RISK_ELEVATED_THRESHOLD:40.0}
      analyst-confidence-threshold: ${ZT_RISK_ANALYST_CONFIDENCE_THRESHOLD:0.70}
      insider-access-anomaly-weight: ${ZT_RISK_INSIDER_ACCESS_ANOMALY_WEIGHT:0.35}
      insider-data-exfiltration-weight: ${ZT_RISK_INSIDER_DATA_EXFILTRATION_WEIGHT:0.40}
      insider-privilege-abuse-weight: ${ZT_RISK_INSIDER_PRIVILEGE_ABUSE_WEIGHT:0.25}
      data-sensitivity-weight: ${ZT_RISK_DATA_SENSITIVITY_WEIGHT:0.40}
      data-exposure-weight: ${ZT_RISK_DATA_EXPOSURE_WEIGHT:0.35}
      data-access-anomaly-weight: ${ZT_RISK_DATA_ACCESS_ANOMALY_WEIGHT:0.25}
      api-exposure-weight: ${ZT_RISK_API_EXPOSURE_WEIGHT:0.35}
      api-abuse-weight: ${ZT_RISK_API_ABUSE_WEIGHT:0.40}
      api-identity-weight: ${ZT_RISK_API_IDENTITY_WEIGHT:0.25}
      saas-privilege-weight: ${ZT_RISK_SAAS_PRIVILEGE_WEIGHT:0.40}
      saas-config-weight: ${ZT_RISK_SAAS_CONFIG_WEIGHT:0.35}
      saas-shadow-weight: ${ZT_RISK_SAAS_SHADOW_WEIGHT:0.25}
